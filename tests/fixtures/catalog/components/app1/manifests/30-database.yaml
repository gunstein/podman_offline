apiVersion: v1
kind: Pod
metadata:
  name: app1-postgres
spec:
  containers:
  - env:
    - name: POSTGRES_USER
      value: '@@DB_USER@@'
    - name: POSTGRES_PASSWORD_FILE
      value: /run/secrets/database/password
    image: registry.example.test/postgres:17
    imagePullPolicy: Never
    name: db
    volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: data
    - mountPath: /run/secrets/database
      name: password
      readOnly: true
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: app1-data
  - name: password
    secret:
      items:
      - key: password
        path: password
      secretName: app1-database-password
