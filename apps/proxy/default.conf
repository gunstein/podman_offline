server {
    listen ${HTTPS_PORT} ssl;
    server_name _;
    ssl_certificate /run/secrets/web/web.crt;
    ssl_certificate_key /run/secrets/web/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;

    # Preserve /identity: Duende uses this as its PathBase.
    location /identity/ {
        proxy_pass http://myproduct-identity:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }
    location /auth/ {
        proxy_pass http://myproduct-todo:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }
    location /api/ {
        proxy_pass http://myproduct-todo:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /help {
        return 308 /help/;
    }
    location /help/ {
        proxy_pass http://myproduct-help:8080/;
    }
    location / {
        proxy_pass http://myproduct-todo:8080;
    }
}
