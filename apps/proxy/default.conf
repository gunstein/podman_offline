server {
    listen ${HTTPS_PORT} ssl;
    server_name _;
    ssl_certificate /run/secrets/web/web.crt;
    ssl_certificate_key /run/secrets/web/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    resolver ${DNS_SERVER} valid=10s ipv6=off;

    location = /livez { access_log off; return 204; }
    location /identity/ {
        set $identity_upstream platform-identity:8080;
        proxy_pass http://$identity_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }
    include /routes/installed.conf;
    location / { return 404; }
}
