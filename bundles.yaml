# Source catalog: the components of this product. Each entry is one component
# with its files in components/<id>/ and one offline bundle. Components that
# are not listed here are not rendered, built, bundled or started.
#
# Each component owns components/<id>/VERSION (major.minor.patch).
# Fields (all optional):
#   requires:     component IDs that must be installed first
#   upgrade:      always (default) reinstalls on every install;
#                 newer-only keeps an equal installed version and refuses downgrades
#   public_from:  dependency whose PUBLIC_ORIGIN, HTTPS_PORT and shares this component must match
#   shares:       config names this component's public_from dependents take from it
#                 (see docs/COMPONENTS.md, "Reserved configuration names")
#   routes:       dependency that serves this component's route.conf
#   clients:      dependency that registers this component's client.yaml
#   accepts:      roles this component serves, mapped to the volume ID that
#                 receives the registrations: {routes: <id>, clients: <id>}
#
# product names the whole installation: the installation root
# /var/lib/<product> and bootstrap file ~/.<product>/<product>.env of the
# runtime account (prepare-host.sh --user), units <product>-<id>.service,
# the shared network <product>, Quadlet files and the bundle archives
# <product>-<id>-<version>-offline.tar.gz. Lowercase letters, digits and inner
# hyphens, a letter first, at most 32 characters.
product: myproduct
components:
  platform:
    upgrade: newer-only
    accepts:
      routes: platform-routes
  identity:
    requires: [platform]
    upgrade: newer-only
    public_from: platform
    routes: platform
    accepts:
      clients: identity-clients
  app1:
    requires: [platform, identity]
    public_from: platform
    routes: platform
    clients: identity
  app2:
    requires: [platform, identity]
    public_from: platform
    routes: platform
    clients: identity
  # .NET/TypeScript demo (backlog 71); not in the fixed acceptance matrix.
  app3:
    requires: [platform, identity]
    public_from: platform
    routes: platform
    clients: identity
  help:
    requires: [platform]
    public_from: platform
    routes: platform
