# The components of this product, in install order. Each is components/<id>/
# with a VERSION file (major.minor.patch) and becomes one offline bundle;
# components not listed here are not rendered, built, bundled or started.
#
# gateway:  the reverse proxy. Every other component reads PUBLIC_ORIGIN and
#           HTTPS_PORT from its config.yaml and requires it; a component with
#           route.conf registers it there.
# identity: signs users in: it registers client.yaml files and checks API
#           secrets, and a component with either requires it.
# Every install renders the component again; a downgrade is refused.
# `./deploy.sh validate` prints what was derived for each component.
#
# product names the whole installation: the installation root
# /var/lib/<product> and bootstrap file ~/.<product>/<product>.env of the
# runtime account (prepare-host.sh --user), units <product>-<id>.service,
# the shared network <product>, Quadlet files and the bundle archives
# <product>-<id>-<version>-offline.tar.gz. Lowercase letters, digits and inner
# hyphens, a letter first, at most 32 characters.
product: myproduct
gateway: platform
identity: identity
# app3 is the .NET/TypeScript demo (backlog 71), not in the fixed acceptance matrix.
components: [platform, identity, app1, app2, app3, help]
