# Source catalog: the components of this product. Each entry is one component
# with its files in components/<id>/ and one offline bundle. Components that
# are not listed here are not rendered, built, bundled or started.
#
# gateway:  the component that is the reverse proxy. Every other component
#           takes its PUBLIC_ORIGIN, HTTPS_PORT and shares, and requires it;
#           a component with route.conf registers it there (<gateway>-routes).
# identity: the component that registers client.yaml files (<identity>-clients)
#           and API secrets (<identity>-apis). A component with neither does
#           not depend on it.
# Per component (all optional):
#   upgrade:  always (default) reinstalls on every install;
#             newer-only keeps an equal installed version and refuses downgrades
#   requires: other components that must be installed first, beyond the above
#   shares:   on the gateway only: extra config names every other component
#             takes from it (see docs/COMPONENTS.md, "Reserved configuration names")
# `./deploy.sh validate` prints what was derived for each component.
#
# Each component owns components/<id>/VERSION (major.minor.patch).
# product names the whole installation: the installation root
# /var/lib/<product> and bootstrap file ~/.<product>/<product>.env of the
# runtime account (prepare-host.sh --user), units <product>-<id>.service,
# the shared network <product>, Quadlet files and the bundle archives
# <product>-<id>-<version>-offline.tar.gz. Lowercase letters, digits and inner
# hyphens, a letter first, at most 32 characters.
product: myproduct
gateway: platform
identity: identity
components:
  platform:
    upgrade: newer-only
  identity:
    upgrade: newer-only
  app1:
  app2:
  # .NET/TypeScript demo (backlog 71); not in the fixed acceptance matrix.
  app3:
  help:
