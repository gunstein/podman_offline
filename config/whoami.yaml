# The demo's target environment file with app3, the optional API (backlog 85).
# Bundles are built without it; on the target the runtime user copies it to
# /var/lib/<product>/state/whoami.yaml and deploys with
#   <product> --environment whoami
# The --whoami acceptance scenario does exactly that. Without it, Identity has
# no registration of app3.
components:
  - platform
  - identity
  - app3
overrides:
  identity:
    ENVIRONMENT:
      app:
        # One API resource per API component, as in the organisation's
        # appsettings.json.
        ApiResources__0__Name: app3-api
        ApiResources__0__Scopes__0: app3
        # app3's own secret (components/app3/config.defaults.yaml). It is
        # delivered while app3 is installed; Identity hashes it itself.
        ApiResources__0__ApiSecrets__0__Value: '@@secret:app3-api-secret/value@@'
