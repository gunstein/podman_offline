apiVersion: v1
kind: ConfigMap
metadata:
  name: example-run-settings
data:
  GREETING: '@@GREETING@@'
  NUMBER: '@@NUMBER@@'
  PORT_TEXT: '@@HTTPS_PORT@@'
---
apiVersion: v1
kind: Pod
metadata:
  name: '@@POD_NAME@@'
spec:
  containers:
  - name: app
    image: localhost/offline-example:1
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    - mkdir -p /www; printf "%s|%s|%s\n" "$GREETING" "$NUMBER" "$PORT_TEXT" > /www/index.html;
      trap 'exit 0' TERM; httpd -f -p 8080 -h /www & wait
    envFrom:
    - configMapRef:
        name: example-run-settings
    ports:
    - containerPort: 8080
      hostPort: '@@HTTPS_PORT@@'
      hostIP: '@@HOST_IP@@'
      protocol: TCP
