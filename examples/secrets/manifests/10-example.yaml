apiVersion: v1
kind: Pod
metadata:
  name: '@@POD_NAME@@'
spec:
  containers:
  - name: app
    image: localhost/offline-example:1
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    - trap 'exit 0' TERM; sleep 3600 & wait
    volumeMounts:
    - name: text
      mountPath: /inputs/text
      readOnly: true
    - name: binary
      mountPath: /inputs/binary
      readOnly: true
    - name: selected
      mountPath: /inputs/selected
      readOnly: true
  volumes:
  - name: text
    secret:
      secretName: example-run-text
  - name: binary
    secret:
      secretName: example-run-binary
      items:
      - key: binary.bin
        path: binary.bin
  - name: selected
    secret:
      secretName: example-run-selected
      items:
      - key: message.txt
        path: renamed.txt
