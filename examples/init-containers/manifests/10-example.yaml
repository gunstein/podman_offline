apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example-run-init
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: '@@POD_NAME@@'
spec:
  initContainers:
  - name: first
    image: localhost/offline-example:1
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    - printf "first\n" > /data/order
    volumeMounts:
    - name: data
      mountPath: /data
  - name: second
    image: localhost/offline-example:1
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    - test "$(cat /data/order)" = first; printf "second\n" >> /data/order
    volumeMounts:
    - name: data
      mountPath: /data
  containers:
  - name: app
    image: localhost/offline-example:1
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    - test "$(cat /data/order)" = "$(printf "first\nsecond")"; cp /data/order /tmp/observed;
      trap 'exit 0' TERM; sleep 3600 & wait
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: example-run-init
