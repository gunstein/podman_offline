apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example-run-appdata
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: example-run-token
type: Opaque
stringData:
  token: synthetic-example-value
---
apiVersion: v1
kind: Pod
metadata:
  name: '@@POD_NAME@@'
spec:
  containers:
  - name: app
    image: localhost/offline-example:1
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    - printf "%s" "$TOKEN" > /data/token-seen; trap 'exit 0' TERM; sleep 3600 & wait
    env:
    - name: TOKEN
      valueFrom:
        secretKeyRef:
          name: example-run-token
          key: token
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: example-run-appdata
