apiVersion: v1
kind: Pod
metadata:
  name: '@@POD_NAME@@'
spec:
  containers:
  - name: app
    image: localhost/offline-example:1
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    - trap 'exit 0' TERM; sleep 3600 & wait
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: example-run-missing
