# Inline placeholders are allowed only in ConfigMap data and SECRET_TEMPLATES;
# a container env value keeps whole-value replacement and must be refused.
apiVersion: v1
kind: Pod
metadata:
  name: example-run-bad
spec:
  containers:
  - name: app
    image: localhost/offline-example:1
    imagePullPolicy: Never
    env:
    - name: GREETING
      value: prefix-@@GREETING@@
