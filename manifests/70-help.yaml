apiVersion: v1
kind: Pod
metadata:
  name: myproduct-help
spec:
  restartPolicy: Always
  containers:
  - name: web
    image: localhost/myproduct-help:0.1.0
    imagePullPolicy: Never
    livenessProbe:
      initialDelaySeconds: 90
      exec:
        command:
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
