apiVersion: v1
kind: Pod
metadata:
  name: myproduct-identity
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: localhost/myproduct-identity:0.1.0
    imagePullPolicy: Never
    envFrom:
    - configMapRef:
        name: myproduct-settings
    env:
    - name: DATABASE_HOST
      value: myproduct-identity-postgres
    volumeMounts:
    - name: signing
      mountPath: /run/secrets/signing
      readOnly: true
    - name: client
      mountPath: /run/secrets/client
      readOnly: true
    - name: password
      mountPath: /run/secrets/database
      readOnly: true
    - name: users
      mountPath: /run/secrets/users
      readOnly: true
    - name: protection
      mountPath: /data/protection
  volumes:
  - name: signing
    secret:
      secretName: identity-signing
      items:
      - key: identity.crt
        path: identity.crt
      - key: identity.key
        path: identity.key
  - name: client
    secret:
      secretName: identity-client-certificate
      items:
      - key: todo-client.crt
        path: todo-client.crt
  - name: password
    secret:
      secretName: identity-database-password
      items:
      - key: password
        path: password
  - name: users
    secret:
      secretName: identity-demo-users
  - name: protection
    persistentVolumeClaim:
      claimName: identity-protection
