apiVersion: v1
kind: Pod
metadata:
  name: myproduct-todo
spec:
  restartPolicy: Never
  containers:
  - name: backend
    image: localhost/myproduct-todo-backend:0.1.0
    imagePullPolicy: Never
    envFrom:
    - configMapRef:
        name: myproduct-settings
    env:
    - name: DATABASE_HOST
      value: myproduct-todo-postgres
    - name: REQUESTS_CA_BUNDLE
      value: /certificates/ca.crt
    volumeMounts:
    - name: certificates
      mountPath: /certificates
      readOnly: true
    - name: password
      mountPath: /run/secrets/database
      readOnly: true
  - name: frontend
    image: localhost/myproduct-todo-frontend:0.1.0
    imagePullPolicy: Never
  volumes:
  - name: certificates
    persistentVolumeClaim:
      claimName: todo-signing
  - name: password
    secret:
      secretName: todo-database-password
      items:
      - key: password
        path: password
