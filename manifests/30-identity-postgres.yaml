apiVersion: v1
kind: Pod
metadata:
  name: myproduct-identity-postgres
spec:
  restartPolicy: Never
  containers:
  - name: db
    image: localhost/myproduct-postgres:17.11
    imagePullPolicy: Never
    env:
    - name: POSTGRES_DB
      value: identity
    - name: POSTGRES_USER
      value: identity
    - name: POSTGRES_PASSWORD_FILE
      value: /run/secrets/database/password
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
    - name: password
      mountPath: /run/secrets/database
      readOnly: true
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: identity-data
  - name: password
    secret:
      secretName: identity-database-password
      items:
      - key: password
        path: password
