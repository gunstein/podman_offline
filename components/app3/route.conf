location = /app3 { return 308 /app3/; }
location /app3/auth/ {
    set $app3_backend app3-whoami:8000;
    proxy_pass http://$app3_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    access_log off;
}
location /app3/api/ {
    set $app3_backend app3-whoami:8000;
    proxy_pass http://$app3_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
}
location /app3/ {
    set $app3_frontend app3-whoami:8080;
    rewrite ^/app3/(.*)$ /$1 break;
    proxy_pass http://$app3_frontend;
}
