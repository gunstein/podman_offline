# Settings the operator may change: init-config copies them to config.yaml.
#
# Empty: discovery, keys and token through the public HTTPS origin and the
# trust chain (backlog 71, variant a). Internal variant b:
# http://identity-server:8080/identity (issuer and browser endpoints stay public).
IDENTITY_INTERNAL_URL: ''
SECRET_FILES:
  app3-client:
  - path: credentials/client
  app3-ingress-trust-chain:
  - path: cert
  # The secret app3 shares with identity; both ENVIRONMENT sections name it.
  app3-api-secret:
  - path: credentials/api-secret
    generate:
    - value

# The environment of each container. It comes with the release and is never
# copied to config.yaml. APP_ID and BASE_PATH stay in the manifest's env: the
# platform compares them with client.yaml.
ENVIRONMENT:
  backend:
    PUBLIC_ORIGIN: '@@PUBLIC_ORIGIN@@'
    IDENTITY_INTERNAL_URL: '@@IDENTITY_INTERNAL_URL@@'
    # Must match ApiResources__0__Name in components/identity/config.defaults.yaml.
    Authentication__ApiName: app3-api
    Authentication__ApiSecret: '@@secret:app3-api-secret/value@@'
