location = /app1 { return 308 /app1/; }
location /app1/auth/ {
    set $app1_backend app1-todo:8000;
    proxy_pass http://$app1_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    access_log off;
}
location /app1/api/ {
    set $app1_backend app1-todo:8000;
    proxy_pass http://$app1_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
}
location /app1/ {
    set $app1_frontend app1-todo:8080;
    rewrite ^/app1/(.*)$ /$1 break;
    proxy_pass http://$app1_frontend;
}
