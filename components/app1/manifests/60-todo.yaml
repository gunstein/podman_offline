apiVersion: v1
kind: Pod
metadata:
  name: app1-todo
  annotations:
    io.podman.annotations.init.container.type: always
spec:
  restartPolicy: Always
  initContainers:
  - name: prepare-database
    image: localhost/demo-todo-backend:0.2.2
    imagePullPolicy: Never
    command: [python, /app/schema.py]
    env:
    - name: DB_HOST
      value: '@@DB_HOST@@'
    - name: DB_PORT
      value: '@@DB_PORT@@'
    - name: DB_USER
      value: '@@DB_USER@@'
    - name: DB_NAME
      value: '@@DB_NAME@@'
    volumeMounts:
    - name: password
      mountPath: /run/secrets/database
      readOnly: true
  - name: seed-database
    image: localhost/demo-postgres:17.11
    imagePullPolicy: Never
    command:
    - sh
    - -ec
    # Fold to one command scalar for Podman's YAML round trip.
    - >-
      export LC_ALL=C PGCONNECT_TIMEOUT=5;
      export PGPASSWORD="$(cat /run/secrets/database/password)";
      for sql in /seed/*.sql; do
      test -f "$sql" || { echo 'Missing demo seed input' >&2; exit 1; };
      psql --no-psqlrc --host "$DB_HOST" --port "$DB_PORT" --username "$DB_USER"
      --dbname "$DB_NAME" --set=ON_ERROR_STOP=1 --single-transaction --file "$sql" >/dev/null 2>&1 || {
      echo 'Demo seed SQL failed (details withheld)' >&2; exit 1; };
      done
    env:
    - name: DB_HOST
      value: '@@DB_HOST@@'
    - name: DB_PORT
      value: '@@DB_PORT@@'
    - name: DB_USER
      value: '@@DB_USER@@'
    - name: DB_NAME
      value: '@@DB_NAME@@'
    volumeMounts:
    - name: password
      mountPath: /run/secrets/database
      readOnly: true
    - name: seed
      mountPath: /seed
      readOnly: true
  containers:
  - name: backend
    image: localhost/demo-todo-backend:0.2.2
    imagePullPolicy: Never
    livenessProbe:
      initialDelaySeconds: 10
      exec:
        command:
        - python
        - -c
        - import urllib.request; r = urllib.request.urlopen("http://127.0.0.1:8000/livez",
          timeout=3); assert r.status == 204
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    envFrom:
    - configMapRef:
        name: app1-settings
    env:
    - name: TODO_SCHEMA_MODE
      value: external
    - name: DB_HOST
      value: '@@DB_HOST@@'
    - name: DB_PORT
      value: '@@DB_PORT@@'
    - name: DB_USER
      value: '@@DB_USER@@'
    - name: DB_NAME
      value: '@@DB_NAME@@'
    - name: REQUESTS_CA_BUNDLE
      value: /certificates/ca.crt
    - name: APP_ID
      value: app1
    - name: BASE_PATH
      value: /app1
    volumeMounts:
    - name: certificates
      mountPath: /certificates
      readOnly: true
    - name: password
      mountPath: /run/secrets/database
      readOnly: true
  - name: frontend
    image: localhost/demo-todo-frontend:0.2.0
    imagePullPolicy: Never
    livenessProbe:
      initialDelaySeconds: 10
      exec:
        command:
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  volumes:
  - name: seed
    persistentVolumeClaim:
      claimName: app1-seed
  - name: certificates
    secret:
      secretName: app1-signing
      defaultMode: 256
      items:
      - key: session-key
        path: session-key
      - key: todo-client.key
        path: todo-client.key
      - key: todo-client.crt
        path: todo-client.crt
      - key: ca.crt
        path: ca.crt
  - name: password
    secret:
      secretName: app1-database-password
      items:
      - key: password
        path: password
