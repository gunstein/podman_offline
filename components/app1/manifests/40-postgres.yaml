apiVersion: v1
kind: Pod
metadata:
  name: app1-postgres
spec:
  restartPolicy: Always
  containers:
  - name: db
    image: localhost/myproduct-postgres:17.11
    imagePullPolicy: Never
    livenessProbe:
      initialDelaySeconds: 90
      exec:
        command:
        - pg_isready
        - -U
        - todo
        - -d
        - todo
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    env:
    - name: POSTGRES_DB
      value: todo
    - name: POSTGRES_USER
      value: todo
    - name: POSTGRES_PASSWORD_FILE
      value: /run/secrets/database/password
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
    - name: password
      mountPath: /run/secrets/database
      readOnly: true
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: app1-data
  - name: password
    secret:
      secretName: app1-database-password
      items:
      - key: password
        path: password
