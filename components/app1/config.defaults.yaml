DB_HOST: app1-postgres
DB_PORT: '5432'
DB_USER: todo
DB_NAME: todo
DEMO_CONFIG_LAYER: defaults
VOLUME_FILES:
  app1-seed:
  - component_file: sql/010-reference.sql
SECRET_FILES:
  app1-database-password:
  - path: credentials/database
    generate:
    - password
  app1-signing:
  - path: credentials/todo
    generate:
    - session-key
  app1-report-password:
  - path: credentials/report
    generate:
    - password

# The environment of each container. It comes with the release and is never
# copied to config.yaml. APP_ID and BASE_PATH come from client.yaml.
ENVIRONMENT:
  backend:
    APP_ID: '@@CLIENT_ID@@'
    BASE_PATH: '@@CLIENT_BASE_PATH@@'
    PUBLIC_ORIGIN: '@@PUBLIC_ORIGIN@@'
    HTTPS_PORT: '@@HTTPS_PORT@@'
    DEMO_CONFIG_LAYER: '@@DEMO_CONFIG_LAYER@@'

# Files mounted into each container. They come with the release; @@...@@ is
# filled in at install. Never copied to config.yaml.
MOUNTS:
  seed-database:
    /seed-secret/020-report-role.sql: sql/020-report-role.sql
