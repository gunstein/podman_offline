DB_HOST: identity-postgres
DB_PORT: '5432'
DB_USER: identity
DB_NAME: identity
SECRET_FILES:
  identity-signing:
  - path: credentials/identity
  identity-database-password:
  - path: credentials/identity-db
    generate:
    - password
  identity-demo-users:
  - path: credentials/users
SECRET_TEMPLATES:
  identity-database:
    ConnectionStrings__Default: "Host=@@DB_HOST@@;Port=@@DB_PORT@@;Database=@@DB_NAME@@;Username=@@DB_USER@@;Password=@@secret:identity-database-password/password@@;Timeout=5;Include Error Detail=false"
