# Settings the operator may change: init-config copies them to config.yaml.
DB_HOST: identity-postgres
DB_PORT: '5432'
DB_USER: identity
DB_NAME: identity
SECRET_FILES:
  identity-signing:
  - path: credentials/identity
  identity-database-password:
  - path: credentials/identity-db
    generate:
    - password
  identity-demo-users:
  - path: credentials/users

# The environment of each container. It comes with the release and is never
# copied to config.yaml.
ENVIRONMENT:
  app:
    PUBLIC_ORIGIN: '@@PUBLIC_ORIGIN@@'
    HTTPS_PORT: '@@HTTPS_PORT@@'
    ConnectionStrings__Default: 'Host=@@DB_HOST@@;Port=@@DB_PORT@@;Database=@@DB_NAME@@;Username=@@DB_USER@@;Password=@@secret:identity-database-password/password@@;Timeout=5;Include Error Detail=false'
    # app3 is an optional API (backlog 85): its ApiResources__0__* lines are in
    # the environments that include app3 (config/whoami.yaml) and, for dev, in
    # config/dev.yaml's overrides (config/dev.yaml.example).
