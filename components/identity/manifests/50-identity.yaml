apiVersion: v1
kind: Pod
metadata:
  name: identity-server
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: localhost/demo-identity:0.2.3
    imagePullPolicy: Never
    livenessProbe:
      initialDelaySeconds: 10
      exec:
        command:
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /identity/health HTTP/1.0\r\nHost:
          localhost\r\nConnection: close\r\n\r\n" >&3; IFS= read -r -t 2 status <&3;
          [[ $status == "HTTP/1.1 200 "* || $status == "HTTP/1.0 200 "* ]]'
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    envFrom:
    - configMapRef:
        name: identity-settings
    # API secrets the platform renders from api.yaml registrations (backlog 72).
    - secretRef:
        name: identity-apis
    env:
    - name: ConnectionStrings__Default
      valueFrom:
        secretKeyRef:
          name: identity-database
          key: ConnectionStrings__Default
    volumeMounts:
    - name: signing
      mountPath: /run/secrets/signing
      readOnly: true
    - name: clients
      mountPath: /clients
      readOnly: true
    - name: users
      mountPath: /run/secrets/users
      readOnly: true
    - name: protection
      mountPath: /data/protection
  volumes:
  - name: signing
    secret:
      secretName: identity-signing
      defaultMode: 256
      items:
      - key: identity.crt
        path: identity.crt
      - key: identity.key
        path: identity.key
  - name: clients
    persistentVolumeClaim:
      claimName: identity-clients
  - name: users
    secret:
      secretName: identity-demo-users
  - name: protection
    persistentVolumeClaim:
      claimName: identity-protection
