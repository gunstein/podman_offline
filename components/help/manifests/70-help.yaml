apiVersion: v1
kind: Pod
metadata:
  name: help-web
spec:
  restartPolicy: Always
  containers:
  - name: web
    image: localhost/demo-help:@@COMPONENT_VERSION@@
    imagePullPolicy: Never
    livenessProbe:
      initialDelaySeconds: 10
      exec:
        command:
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
