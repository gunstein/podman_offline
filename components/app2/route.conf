location = /app2 { return 308 /app2/; }
location /app2/auth/ {
    set $app2_backend app2-todo:8000;
    proxy_pass http://$app2_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    access_log off;
}
location /app2/api/ {
    set $app2_backend app2-todo:8000;
    proxy_pass http://$app2_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
}
location /app2/ {
    set $app2_frontend app2-todo:8080;
    rewrite ^/app2/(.*)$ /$1 break;
    proxy_pass http://$app2_frontend;
}
