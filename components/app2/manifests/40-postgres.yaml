apiVersion: v1
kind: Pod
metadata:
  name: app2-postgres
spec:
  restartPolicy: Always
  containers:
  - name: db
    image: localhost/demo-postgres:17.11
    imagePullPolicy: Never
    livenessProbe:
      initialDelaySeconds: 10
      exec:
        command:
        - pg_isready
        - -U
        - '@@DB_USER@@'
        - -d
        - '@@DB_NAME@@'
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    env:
    - name: POSTGRES_DB
      value: '@@DB_NAME@@'
    - name: POSTGRES_USER
      value: '@@DB_USER@@'
    - name: PGPORT
      value: '@@DB_PORT@@'
    - name: POSTGRES_PASSWORD_FILE
      value: /run/secrets/database/password
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    # The file POSTGRES_PASSWORD_FILE names is a MOUNTS secret file in
    # config.defaults.yaml (backlog 82); app1 mounts its Secret as a directory.
    volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: app2-data
