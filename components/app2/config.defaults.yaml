DB_HOST: app2-postgres
DB_PORT: '5432'
DB_USER: todo
DB_NAME: todo
SECRET_FILES:
  app2-database-password:
  - path: credentials/database
    generate:
    - password
  app2-signing:
  - path: credentials/todo
    generate:
    - session-key

# The environment of each container. It comes with the release and is never
# copied to config.yaml. APP_ID and BASE_PATH come from client.yaml.
ENVIRONMENT:
  backend:
    APP_ID: '@@CLIENT_ID@@'
    BASE_PATH: '@@CLIENT_BASE_PATH@@'
    PUBLIC_ORIGIN: '@@PUBLIC_ORIGIN@@'
    HTTPS_PORT: '@@HTTPS_PORT@@'

# Files mounted read-only into a container. The database reads its password
# from POSTGRES_PASSWORD_FILE in the manifest; the file comes unchanged from
# the app2-database-password Secret.
MOUNTS:
  db:
    /run/secrets/database/password: '@@secret:app2-database-password/password@@'
