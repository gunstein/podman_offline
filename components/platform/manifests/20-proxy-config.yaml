apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-proxy-config
data:
  default.conf.template: |
    server {
        listen ${HTTPS_PORT} ssl;
        server_name _;
        ssl_certificate /run/secrets/web/web.crt;
        ssl_certificate_key /run/secrets/web/web.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16k;
        resolver ${DNS_SERVER} valid=10s ipv6=off;

        location = /livez { access_log off; return 204; }
        include /routes/installed.conf;
        location / { return 404; }
    }
