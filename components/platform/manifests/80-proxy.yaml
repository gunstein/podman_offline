apiVersion: v1
kind: Pod
metadata:
  name: platform-proxy
spec:
  restartPolicy: Always
  containers:
  - name: nginx
    image: docker.io/library/nginx:1.28-alpine
    imagePullPolicy: Never
    command:
    - /bin/sh
    - -ec
    args:
    - |
      DNS_SERVER=$(awk '/^nameserver / { print $2; exit }' /etc/resolv.conf)
      : "${DNS_SERVER:?No DNS server in /etc/resolv.conf}"
      : "${HTTPS_PORT:?HTTPS_PORT is required}"
      export DNS_SERVER
      # Pass a literal whitelist to envsubst; keep other nginx variables unchanged.
      # shellcheck disable=SC2016
      envsubst '${HTTPS_PORT} ${DNS_SERVER}' < /etc/nginx/proxy-template/default.conf.template > /etc/nginx/conf.d/default.conf
      exec nginx -g 'daemon off;'
    livenessProbe:
      initialDelaySeconds: 90
      exec:
        command:
        - sh
        - -c
        - wget -q -O /dev/null --no-check-certificate https://127.0.0.1:${HTTPS_PORT}/livez
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    envFrom:
    - configMapRef:
        name: platform-settings
    ports:
    - containerPort: '@@HTTPS_PORT@@'
      hostPort: '@@HTTPS_PORT@@'
      hostIP: '@@IP_ADDRESS@@'
      protocol: TCP
    volumeMounts:
    - name: proxy-config
      mountPath: /etc/nginx/proxy-template
      readOnly: true
    - name: tls
      mountPath: /run/secrets/web
      readOnly: true
    - name: routes
      mountPath: /routes
      readOnly: true
  volumes:
  - name: proxy-config
    configMap:
      name: platform-proxy-config
      defaultMode: 292
      items:
      - key: default.conf.template
        path: default.conf.template
  - name: tls
    secret:
      secretName: platform-web-tls
      defaultMode: 256
      items:
      - key: web.crt
        path: web.crt
      - key: web.key
        path: web.key
  - name: routes
    persistentVolumeClaim:
      claimName: platform-routes
  hostname: '@@PUBLIC_HOSTNAME@@'
