# Copy to config.yaml. For local dev, add this hostname to /etc/hosts.
# Keep hostname/port consistent with the certificate and nginx listen port.
PUBLIC_ORIGIN: https://myproduct-proxy:8443
IP_ADDRESS: 127.0.0.1
HTTPS_PORT: 8443
SECRET_FILES:
  identity-signing:
    - generated-certificates/identity
  identity-client-certificate:
    - generated-certificates/client
  identity-database-password:
    - generated-certificates/identity-db
  todo-database-password:
    - generated-certificates/todo-db
  identity-demo-users:
    - generated-certificates/users
  web-tls:
    - generated-certificates/web
VOLUME_FILES:
  todo-signing:
    - generated-certificates/todo
